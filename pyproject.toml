[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biodeg-rate-methods"
version = "0.1.0"
description = "Three independent estimators of a bulk attenuation rate from groundwater monitoring data, kept separate by construction."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Environmental Material Science Inc." }]
keywords = ["groundwater", "biodegradation", "attenuation", "Mann-Kendall", "Domenico", "P-spline"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools]
packages = ["biodeg_rates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
